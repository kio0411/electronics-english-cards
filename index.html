<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e2523" />
  <meta name="description" content="专业英语词汇复习" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>电英词卡</title>
  <style>
    :root { --ink:#13211f; --muted:#66736f; --line:#d9e0dc; --paper:#fbfcfa; --panel:#ffffff; --mint:#d7f0df; --green:#0e6b50; --green-dark:#0e2523; --yellow:#f4d87a; --red:#ce5d48; --shadow:0 15px 35px rgba(20, 43, 38, .11); }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; min-height:100svh; color:var(--ink); background:var(--paper); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; letter-spacing:0; }
    button, select { font:inherit; }
    button { cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
    .app { width:min(100%, 620px); min-height:100svh; margin:auto; padding:calc(18px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; }
    .mark { width:32px; height:32px; display:grid; place-items:center; background:var(--green-dark); color:white; border-radius:7px; font-size:15px; }
    .streak { color:var(--green); font-size:13px; font-weight:700; white-space:nowrap; }
    .deckbar { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .studybar { display:flex; align-items:center; gap:10px; margin-top:10px; }
    .studybar select { min-width:0; flex:1; appearance:none; color:var(--green-dark); font-weight:700; background:#f1f5f2; border:1px solid var(--line); border-radius:6px; padding:9px 30px 9px 11px; background-image:linear-gradient(45deg,transparent 50%,var(--green-dark) 50%),linear-gradient(135deg,var(--green-dark) 50%,transparent 50%); background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
    .wordbook-button { min-width:68px; min-height:40px; border:1px solid var(--green-dark); border-radius:6px; background:#fff; color:var(--green-dark); font-weight:800; }
    .bookbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
    .bookbar label { color:var(--muted); font-size:12px; font-weight:700; }
    .bookbar select { max-width:78%; min-width:0; appearance:none; color:var(--green-dark); font-weight:800; text-align:right; background:transparent; border:0; padding:2px 22px 2px 0; background-image:linear-gradient(45deg,transparent 50%,var(--green-dark) 50%),linear-gradient(135deg,var(--green-dark) 50%,transparent 50%); background-position:calc(100% - 10px) 50%,calc(100% - 5px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
    .deckbar select { min-width:0; appearance:none; color:var(--green-dark); font-weight:700; background:transparent; border:0; padding:2px 22px 2px 0; background-image:linear-gradient(45deg,transparent 50%,var(--green-dark) 50%),linear-gradient(135deg,var(--green-dark) 50%,transparent 50%); background-position:calc(100% - 10px) 50%,calc(100% - 5px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
    .modebar { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; padding:4px; margin-bottom:18px; border:1px solid var(--line); border-radius:8px; background:#f1f5f2; }
    .modebar button { min-height:36px; border:0; border-radius:5px; color:var(--muted); background:transparent; font-size:13px; font-weight:800; }
    .modebar button[aria-selected="true"] { color:var(--green-dark); background:#fff; box-shadow:0 1px 3px rgba(20,43,38,.12); }
    .count { color:var(--muted); font-size:13px; }
    .progress { height:5px; overflow:hidden; margin:11px 0 18px; background:#e6ece8; border-radius:5px; }
    .progress > i { display:block; height:100%; width:0; background:var(--green); border-radius:inherit; transition:width .3s ease; }
    main { flex:1; display:flex; flex-direction:column; }
    .card { position:relative; min-height:348px; display:flex; flex:1; flex-direction:column; justify-content:center; padding:35px 30px 28px; background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); text-align:center; touch-action:manipulation; }
    .label { position:absolute; top:20px; left:22px; color:var(--green); font-size:12px; font-weight:800; letter-spacing:.08em; }
    .term { margin:0; overflow-wrap:anywhere; color:var(--green-dark); font-family:Georgia,"Times New Roman",serif; font-size:clamp(31px, 8vw, 47px); font-weight:600; line-height:1.12; }
    .phonetic { min-height:24px; margin:15px 0 4px; color:var(--muted); font-size:15px; }
    .meaning { display:none; margin:10px 0 0; color:var(--ink); font-size:clamp(23px, 6vw, 30px); font-weight:750; line-height:1.35; }
    .note { display:none; margin:9px 0 0; color:var(--muted); font-size:13px; }
    .card.revealed .meaning, .card.revealed .note { display:block; }
    .listen { position:absolute; right:14px; bottom:14px; width:38px; height:38px; display:grid; place-items:center; border:1px solid var(--line); background:#fff; border-radius:50%; color:var(--green); font-size:17px; }
    .flag { position:absolute; right:14px; top:14px; width:38px; height:38px; border:1px solid var(--line); border-radius:50%; background:#fff; color:var(--muted); font-size:19px; line-height:1; }
    .flag.is-flagged { border-color:#e8d28c; color:#9a7200; background:#fff7dc; }
    .hint { display:flex; justify-content:center; align-items:center; min-height:50px; color:var(--muted); font-size:13px; }
    .controls { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
    .controls[hidden] { display:none; }
    .controls button { min-height:52px; padding:7px 4px; border:1px solid var(--line); border-radius:7px; background:white; color:var(--ink); font-weight:750; font-size:14px; }
    .controls button small { display:block; margin-top:3px; color:var(--muted); font-size:10px; font-weight:600; }
    .controls .again { border-color:#e6b6aa; color:#9f3b2d; }
    .controls .hard { border-color:#e8d28c; color:#81650c; }
    .controls .good { border-color:#9ccfb3; color:#176b45; }
    .controls .easy { background:var(--green-dark); border-color:var(--green-dark); color:#fff; }
    .controls .easy small { color:#c8dfd5; }
    .reveal { width:100%; min-height:55px; border:0; border-radius:7px; background:var(--green-dark); color:#fff; font-weight:800; font-size:16px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; margin-top:24px; background:var(--line); border:1px solid var(--line); border-radius:7px; overflow:hidden; }
    .stat { padding:13px 8px 12px; background:var(--panel); text-align:center; }
    .stat b { display:block; color:var(--green-dark); font-size:19px; }
    .stat span { display:block; margin-top:2px; color:var(--muted); font-size:11px; }
    .footer { display:flex; justify-content:space-between; align-items:center; min-height:37px; margin-top:13px; color:var(--muted); font-size:12px; }
    .text-button { padding:7px 0; border:0; background:transparent; color:var(--green); font-weight:700; }
    dialog { width:min(calc(100% - 32px), 460px); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); color:var(--ink); }
    dialog::backdrop { background:rgba(9, 30, 26, .42); }
    dialog h2 { margin:4px 0 10px; font-size:19px; }
    dialog p { color:var(--muted); font-size:14px; line-height:1.65; }
    dialog button { min-height:40px; padding:0 15px; border:0; border-radius:6px; background:var(--green-dark); color:white; font-weight:700; }
    .wordbook-dialog { max-height:min(720px, calc(100svh - 32px)); padding:18px; }
    .wordbook-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .wordbook-head h2 { margin:0; }
    .wordbook-head button { min-width:40px; padding:0 12px; }
    .wordbook-filter, .wordbook-search { width:100%; margin:14px 0 10px; border:1px solid var(--line); border-radius:6px; padding:10px; color:var(--green-dark); background:#f1f5f2; font:inherit; font-weight:700; }
    .wordbook-search { margin:0 0 10px; background:#fff; font-weight:500; }
    .wordbook-summary { margin:0 0 10px; color:var(--muted); font-size:13px; }
    .wordbook-list { max-height:min(540px, calc(100svh - 190px)); overflow:auto; border-top:1px solid var(--line); }
    .wordbook-row { width:100%; display:grid; grid-template-columns:1fr auto; gap:12px; padding:13px 2px; border:0; border-bottom:1px solid var(--line); border-radius:0; background:transparent; color:var(--ink); text-align:left; }
    .wordbook-row strong { display:block; color:var(--green-dark); font-family:Georgia,"Times New Roman",serif; font-size:17px; overflow-wrap:anywhere; }
    .wordbook-row span { display:block; margin-top:3px; color:var(--muted); font-size:13px; }
    .wordbook-row small { align-self:center; color:var(--green); font-size:12px; font-weight:800; white-space:nowrap; }
    .wordbook-empty { margin:30px 0; color:var(--muted); text-align:center; font-size:14px; }
    .wordbook-more { width:100%; min-height:44px; margin-top:10px; border:1px solid var(--green-dark); border-radius:6px; background:#fff; color:var(--green-dark); font-weight:800; }
    .reader { display:flex; flex:1; flex-direction:column; }
    .reader-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:15px; }
    .reader-top select { width:100%; min-width:0; border:0; color:var(--green-dark); background:transparent; font-weight:800; font-size:16px; }
    .reader-count { padding-top:3px; color:var(--muted); font-size:12px; white-space:nowrap; }
    .passage { padding:25px 24px 24px; border:1px solid var(--line); border-radius:8px; background:var(--panel); box-shadow:var(--shadow); }
    .passage-tag { color:var(--green); font-size:12px; font-weight:800; letter-spacing:.06em; }
    .passage h1 { margin:9px 0 7px; color:var(--green-dark); font-family:Georgia,"Times New Roman",serif; font-size:clamp(25px,6vw,33px); line-height:1.14; }
    .passage-meta { margin:0 0 21px; color:var(--muted); font-size:13px; }
    .passage-text { margin:0; color:#263430; font-family:Georgia,"Times New Roman",serif; font-size:18px; line-height:1.72; text-align:left; }
    .translation { margin:20px 0 0; padding-top:18px; border-top:1px solid var(--line); color:var(--ink); font-size:15px; line-height:1.75; }
    .reader-actions { display:grid; grid-template-columns:1fr 48px; gap:9px; margin-top:14px; }
    .reader-actions button, .reader-nav button { min-height:48px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--green-dark); font-weight:800; }
    .reader-actions .translation-toggle { border-color:var(--green-dark); background:var(--green-dark); color:#fff; }
    .reader-nav { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:10px; }
    .keyword-panel { margin-top:18px; }
    .keyword-panel h2 { margin:0 0 9px; color:var(--muted); font-size:12px; }
    .keyword-list { display:flex; flex-wrap:wrap; gap:7px; }
    .keyword-list span { padding:6px 9px; border:1px solid var(--line); border-radius:5px; color:var(--green); background:#fff; font-size:12px; font-weight:700; }
    .interview { display:flex; flex:1; flex-direction:column; }
    .interview-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:15px; }
    .interview-top select { width:100%; min-width:0; border:0; color:var(--green-dark); background:transparent; font-weight:800; font-size:15px; }
    .interview-count { padding-top:3px; color:var(--muted); font-size:12px; white-space:nowrap; }
    .interview-card { padding:25px 24px 24px; border:1px solid var(--line); border-radius:8px; background:var(--panel); box-shadow:var(--shadow); }
    .interview-category { color:var(--green); font-size:12px; font-weight:800; letter-spacing:.06em; }
    .interview-question { margin:9px 0 20px; color:var(--green-dark); font-family:Georgia,"Times New Roman",serif; font-size:clamp(24px,6vw,32px); line-height:1.18; }
    .interview-answer { display:none; margin:0; padding-top:18px; border-top:1px solid var(--line); color:#263430; font-family:Georgia,"Times New Roman",serif; font-size:16px; line-height:1.72; text-align:left; }
    .interview-translation { display:none; margin:16px 0 0; color:var(--ink); font-size:15px; line-height:1.72; text-align:left; }
    .interview-card.revealed .interview-answer, .interview-card.revealed .interview-translation { display:block; }
    .interview-actions { display:grid; grid-template-columns:1fr 48px; gap:9px; margin-top:14px; }
    .interview-actions button, .interview-nav button { min-height:48px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--green-dark); font-weight:800; }
    .interview-actions .interview-reveal { border-color:var(--green-dark); background:var(--green-dark); color:#fff; }
    .interview-nav { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:10px; }
    .interview-rating { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-top:14px; }
    .interview-rating[hidden] { display:none; }
    .interview-rating button { min-height:52px; padding:7px 4px; border:1px solid var(--line); border-radius:7px; background:white; color:var(--ink); font-weight:750; font-size:14px; }
    .interview-rating button small { display:block; margin-top:3px; color:var(--muted); font-size:10px; font-weight:600; }
    .interview-rating .again { border-color:#e6b6aa; color:#9f3b2d; }
    .interview-rating .hard { border-color:#e8d28c; color:#81650c; }
    .interview-rating .good { border-color:#9ccfb3; color:#176b45; }
    .interview-rating .easy { background:var(--green-dark); border-color:var(--green-dark); color:#fff; }
    .interview-rating .easy small { color:#c8dfd5; }
    .interview-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; margin-top:18px; background:var(--line); border:1px solid var(--line); border-radius:7px; overflow:hidden; }
    .interview-stat { padding:12px 8px; background:var(--panel); text-align:center; }
    .interview-stat b { display:block; color:var(--green-dark); font-size:18px; }
    .interview-stat span { display:block; margin-top:2px; color:var(--muted); font-size:11px; }
    @media (min-width:720px) { .app { padding-top:30px; } .card { min-height:390px; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><span class="mark">E</span><span>电英词卡</span></div>
      <span class="streak" id="streak">今天第 1 次</span>
    </header>
    <div class="modebar" role="tablist" aria-label="学习模式"><button id="cardsMode" role="tab" aria-selected="true">单词复习</button><button id="readingMode" role="tab" aria-selected="false">论文朗读</button><button id="interviewMode" role="tab" aria-selected="false">面试问答</button></div>
    <div id="cardsView">
    <div class="bookbar"><label for="book">词书</label><select id="book" aria-label="选择词书"></select></div>
    <div class="deckbar"><select id="deck" aria-label="选择词库"></select><span class="count" id="count"></span></div>
    <div class="studybar"><select id="order" aria-label="选择背诵顺序"><option value="review">复习优先</option><option value="sequential">词书顺序</option><option value="random">随机顺序</option><option value="difficult">不熟悉优先</option></select><button class="wordbook-button" id="openWordbook">词本</button></div>
    <div class="progress" aria-label="本轮进度"><i id="progress"></i></div>
    <main>
      <section class="card" id="card" aria-live="polite">
        <span class="label" id="label">专业英语</span>
        <h1 class="term" id="term"></h1>
        <p class="phonetic" id="phonetic"></p>
        <p class="meaning" id="meaning"></p>
        <p class="note" id="note">想起来了吗？选择熟悉程度以安排下次复习</p>
        <button class="flag" id="toggleUnfamiliar" aria-label="标为不熟悉" title="标为不熟悉">○</button>
        <button class="listen" id="listen" aria-label="朗读单词" title="朗读单词">&#128266;</button>
      </section>
      <div class="hint" id="hint">先在脑中回忆中文含义</div>
      <button class="reveal" id="reveal">显示释义</button>
      <div class="controls" id="rating" hidden>
        <button class="again" data-rating="again">再来<small>1 分钟</small></button>
        <button class="hard" data-rating="hard">困难<small>10 分钟</small></button>
        <button class="good" data-rating="good">记住<small>明天</small></button>
        <button class="easy" data-rating="easy">熟练<small>4 天后</small></button>
      </div>
    </main>
    <section class="stats" aria-label="学习统计">
      <div class="stat"><b id="due">0</b><span>待复习</span></div>
      <div class="stat"><b id="learned">0</b><span>已掌握</span></div>
      <div class="stat"><b id="today">0</b><span>今日完成</span></div>
    </section>
    <div class="footer"><span id="source">词库来自《专业英语》</span><button class="text-button" id="about">使用说明</button></div>
    </div>
    <section class="reader" id="readingView" hidden aria-live="polite">
      <div class="reader-top"><select id="passageSelect" aria-label="选择朗读材料"></select><span class="reader-count" id="passageCount"></span></div>
      <article class="passage">
        <div class="passage-tag" id="passageTopic"></div>
        <h1 id="passageTitle"></h1>
        <p class="passage-meta" id="passageMeta"></p>
        <p class="passage-text" id="passageText"></p>
        <p class="translation" id="passageTranslation" hidden></p>
        <div class="reader-actions"><button class="translation-toggle" id="translationToggle">显示参考译文</button><button id="passageListen" aria-label="朗读段落" title="朗读段落">&#128266;</button></div>
      </article>
      <section class="keyword-panel"><h2>关键词</h2><div class="keyword-list" id="keywordList"></div></section>
      <div class="reader-nav"><button id="previousPassage">上一段</button><button id="nextPassage">下一段</button></div>
    </section>
    <section class="interview" id="interviewView" hidden aria-live="polite">
      <div class="interview-top"><select id="interviewSelect" aria-label="选择面试真题"></select><span class="interview-count" id="interviewCount"></span></div>
      <article class="interview-card" id="interviewCard">
        <div class="interview-category" id="interviewCategory"></div>
        <h1 class="interview-question" id="interviewQuestion"></h1>
        <p class="interview-answer" id="interviewAnswer"></p>
        <p class="interview-translation" id="interviewTranslation"></p>
        <div class="interview-actions"><button class="interview-reveal" id="interviewReveal">显示高分回答与翻译</button><button id="interviewListen" aria-label="朗读问题与回答" title="朗读问题与回答">&#128266;</button></div>
      </article>
      <div class="interview-rating" id="interviewRating" hidden>
        <button class="again" data-interview-rating="again">再来<small>1 分钟</small></button>
        <button class="hard" data-interview-rating="hard">困难<small>10 分钟</small></button>
        <button class="good" data-interview-rating="good">记住<small>明天</small></button>
        <button class="easy" data-interview-rating="easy">熟练<small>4 天后</small></button>
      </div>
      <section class="interview-stats" aria-label="面试问答统计">
        <div class="interview-stat"><b id="interviewDue">0</b><span>待复习</span></div>
        <div class="interview-stat"><b id="interviewLearned">0</b><span>已掌握</span></div>
        <div class="interview-stat"><b id="interviewToday">0</b><span>今日完成</span></div>
      </section>
      <div class="interview-nav"><button id="previousInterview">上一题</button><button id="nextInterview">下一题</button></div>
    </section>
  </div>
  <dialog id="aboutDialog"><h2>电英词卡</h2><p>这是根据两份专业英语词汇 PDF 整理的离线词卡。点按卡片或“显示释义”后，根据掌握程度评分。学习位置、复习次数和不熟悉词本会保存在本设备浏览器中；更换浏览器或清除网站数据会重置记录。</p><button id="closeAbout">知道了</button></dialog>
  <dialog class="wordbook-dialog" id="wordbookDialog"><div class="wordbook-head"><h2>词本</h2><button id="closeWordbook" aria-label="关闭词本" title="关闭词本">×</button></div><select class="wordbook-filter" id="wordbookFilter" aria-label="筛选词本"><option value="all">全部词</option><option value="unfamiliar">不熟悉</option><option value="learning">学习中</option><option value="learned">已掌握</option></select><input class="wordbook-search" id="wordbookSearch" type="search" placeholder="搜索英文或中文" aria-label="搜索词本" autocomplete="off" /><p class="wordbook-summary" id="wordbookSummary"></p><div class="wordbook-list" id="wordbookList"></div><button class="wordbook-more" id="wordbookMore" hidden>继续加载</button></dialog>
  <script src="additional-book.js"></script>
  <script src="reading-passages.js"></script>
  <script src="interview-questions.js"></script>
  <script>
    window.__cardsVersion = '20260816.2';
    // Keep the core study flow available when a stale offline cache misses an optional data file.
    if (!Element.prototype.replaceChildren) {
      Element.prototype.replaceChildren = function() { while (this.firstChild) this.removeChild(this.firstChild); for (let i = 0; i < arguments.length; i += 1) this.appendChild(arguments[i]); };
    }
    if (!Element.prototype.closest) {
      Element.prototype.closest = function(selector) { let node = this; while (node && node.nodeType === 1) { if (node.matches && node.matches(selector)) return node; node = node.parentElement; } return null; };

    const passages = Array.isArray(window.readingPassages) && window.readingPassages.length ? window.readingPassages : fallbackPassages;
    let passageIndex = 0;
    function renderPassage() { const item = passages[passageIndex]; $('passageSelect').value = String(passageIndex); $('passageCount').textContent = `${passageIndex + 1} / ${passages.length}`; $('passageTopic').textContent = item.topic; $('passageTitle').textContent = item.title; $('passageMeta').textContent = `${item.words} words · about 1 minute`; $('passageText').textContent = item.text; $('passageTranslation').textContent = item.translation; $('passageTranslation').hidden = true; $('translationToggle').textContent = '显示参考译文'; $('keywordList').replaceChildren(...item.keywords.map(word => { const tag = document.createElement('span'); tag.textContent = word; return tag; })); }
    passages.forEach((item, index) => $('passageSelect').add(new Option(`${index + 1}. ${item.title}`, String(index))));
    $('passageSelect').addEventListener('change', e => { passageIndex = Number(e.target.value); renderPassage(); });
    $('translationToggle').addEventListener('click', () => { const target = $('passageTranslation'); target.hidden = !target.hidden; $('translationToggle').textContent = target.hidden ? '显示参考译文' : '隐藏参考译文'; });
    $('previousPassage').addEventListener('click', () => { passageIndex = (passageIndex + passages.length - 1) % passages.length; renderPassage(); });
    $('nextPassage').addEventListener('click', () => { passageIndex = (passageIndex + 1) % passages.length; renderPassage(); });
    $('passageListen').addEventListener('click', () => { if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === 'undefined') return; speechSynthesis.cancel(); const utterance = new SpeechSynthesisUtterance(passages[passageIndex].text); utterance.lang = 'en-US'; utterance.rate = .82; speechSynthesis.speak(utterance); });
    const interviewQuestions = Array.isArray(window.interviewQuestions) && window.interviewQuestions.length ? window.interviewQuestions : fallbackInterviewQuestions;
    const interviewKey = 'dianying-interview-v1';
    const interviewDefaultState = { reviews:{}, today:'', doneToday:0 };
    let interviewState = readState(interviewKey, { ...interviewDefaultState });
    if (!interviewState.reviews || typeof interviewState.reviews !== 'object') interviewState.reviews = {};
    if (interviewState.today !== todayKey) { interviewState.today = todayKey; interviewState.doneToday = 0; }
    let interviewIndex = 0, interviewRevealed = false, currentMode = 'cards';
    function saveInterview() { writeState(interviewKey, interviewState); }
    function interviewDue() { const now = Date.now(); return interviewQuestions.filter((item, index) => !interviewState.reviews[`interview-${index}`] || interviewState.reviews[`interview-${index}`].next <= now); }
    function renderInterview() {
      const item = interviewQuestions[interviewIndex];
      $('interviewSelect').value = String(interviewIndex);
      $('interviewCount').textContent = `${interviewIndex + 1} / ${interviewQuestions.length}`;
      $('interviewCategory').textContent = item.category;
      $('interviewQuestion').textContent = item.question;
      $('interviewAnswer').textContent = item.answer;
      $('interviewTranslation').textContent = item.translation;
      $('interviewCard').classList.remove('revealed');
      $('interviewReveal').hidden = false;
      $('interviewRating').hidden = true;
      const due = interviewDue();
      const learned = interviewQuestions.filter((item, index) => { const review = interviewState.reviews[`interview-${index}`]; return (review && review.level || 0) >= 3; }).length;
      $('interviewDue').textContent = due.length;
      $('interviewLearned').textContent = learned;
      $('interviewToday').textContent = interviewState.doneToday;
      interviewRevealed = false;
    }
    function revealInterview() { if (interviewRevealed) return; interviewRevealed = true; $('interviewCard').classList.add('revealed'); $('interviewReveal').hidden = true; $('interviewRating').hidden = false; }
    function chooseInterview() {
      const due = interviewDue();
      const pool = due.length ? due : interviewQuestions.map((item, index) => ({ item, index }));
      const choices = pool.filter(entry => entry.index !== interviewIndex);
      const pick = (choices.length ? choices : pool)[Math.floor(Math.random() * (choices.length ? choices.length : pool.length))];
      interviewIndex = pick.index === undefined ? interviewQuestions.indexOf(pick) : pick.index;
      renderInterview();
    }
    function rateInterview(rating) {
      if (!interviewRevealed) return revealInterview();
      const minutes = { again:1, hard:10, good:1440, easy:5760 }[rating];
      const id = `interview-${interviewIndex}`;
      const currentReview = interviewState.reviews[id] || { level:0 };
      const delta = { again:-1, hard:0, good:1, easy:2 }[rating];
      interviewState.reviews[id] = { level:Math.max(0, Math.min(5, currentReview.level + delta)), next:Date.now() + minutes * 60 * 1000 };
      interviewState.doneToday += 1;
      saveInterview();
      chooseInterview();
    }
    interviewQuestions.forEach((item, index) => $('interviewSelect').add(new Option(`${index + 1}. ${item.question}`, String(index))));
    $('interviewSelect').addEventListener('change', e => { interviewIndex = Number(e.target.value); renderInterview(); });
    $('interviewReveal').addEventListener('click', revealInterview);
    $('interviewCard').addEventListener('click', e => { if (e.target.id !== 'interviewListen') revealInterview(); });
    $('interviewListen').addEventListener('click', e => { e.stopPropagation(); if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === 'undefined') return; speechSynthesis.cancel(); const item = interviewQuestions[interviewIndex]; const utterance = new SpeechSynthesisUtterance(`${item.question}. ${item.answer}`); utterance.lang = 'en-US'; utterance.rate = .78; speechSynthesis.speak(utterance); });
    $('interviewRating').addEventListener('click', e => { const button = e.target.closest('[data-interview-rating]'); if (button) rateInterview(button.dataset.interviewRating); });
    $('previousInterview').addEventListener('click', () => { interviewIndex = (interviewIndex + interviewQuestions.length - 1) % interviewQuestions.length; renderInterview(); });
    $('nextInterview').addEventListener('click', () => { interviewIndex = (interviewIndex + 1) % interviewQuestions.length; renderInterview(); });
    function setMode(mode) {
      currentMode = mode;
      const reading = mode === 'reading', interview = mode === 'interview';
      $('cardsView').hidden = mode !== 'cards';
      $('readingView').hidden = !reading;
      $('interviewView').hidden = !interview;
      $('cardsMode').setAttribute('aria-selected', String(mode === 'cards'));
      $('readingMode').setAttribute('aria-selected', String(reading));
      $('interviewMode').setAttribute('aria-selected', String(interview));
      if (reading) renderPassage();
      if (interview) renderInterview();
    }
    $('cardsMode').addEventListener('click', () => setMode('cards'));
    $('readingMode').addEventListener('click', () => setMode('reading'));
    $('interviewMode').addEventListener('click', () => setMode('interview'));
    document.addEventListener('keydown', e => {
      if (currentMode === 'interview') {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); revealInterview(); }
        if (interviewRevealed && ['1','2','3','4'].includes(e.key)) rateInterview(['again','hard','good','easy'][Number(e.key)-1]);
        return;
      }
      if (currentMode === 'cards') {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); reveal(); }
        if (revealed && ['1','2','3','4'].includes(e.key)) rate(['again','hard','good','easy'][Number(e.key)-1]);
      }
    });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').then(registration => registration.update()).catch(() => undefined);
    restoreWord();
  </script>
</body>
